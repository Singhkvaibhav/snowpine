name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      # A real Postgres, not mocks - see backend/README's Testing section
      # for why (the concurrency test specifically needs real row locking).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snowpine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/snowpine_test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t snowpine-backend-ci -f backend/Dockerfile backend
      - name: Validate nginx config syntax
        run: |
          mkdir -p /tmp/certs/live/snowpine /tmp/html
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/certs/live/snowpine/privkey.pem \
            -out /tmp/certs/live/snowpine/fullchain.pem \
            -days 1 -subj "/CN=ci-test"
          echo "<html></html>" > /tmp/html/index.html
          # api:4000 only resolves inside the real compose network - swap
          # in a host nginx -t can actually resolve, same as the manual
          # validation this config has already been through.
          sed 's/api:4000/127.0.0.1:4000/' deploy/nginx/snowpine.conf > /tmp/snowpine.conf
          docker run --rm \
            -v /tmp/snowpine.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/certs:/etc/letsencrypt:ro \
            -v /tmp/html:/usr/share/nginx/html:ro \
            nginx:1.27-alpine nginx -t
