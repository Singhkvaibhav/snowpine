# Reverse proxy: TLS termination, static SPA, and API routing - one public
# entry point in front of both the built frontend and the API.

upstream snowpine_api {
    server api:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_edge:10m rate=30r/s;

# Plain HTTP exists only to redirect - and to serve ACME challenges, which
# must stay on HTTP or certificate renewal breaks.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/snowpine/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snowpine/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Deliberately without `preload` - preloading is effectively
    # irreversible, not worth committing to before the domain is settled.
    #
    # nginx gotcha: `add_header` does NOT accumulate - a location block
    # with any add_header of its own DISCARDS every add_header inherited
    # from here. The /assets/ location below sets its own Cache-Control,
    # so it repeats this full header set rather than silently losing them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allows exactly what Razorpay's checkout.js needs (script, iframe,
    # XHR to their API/analytics) and nothing else. style-src needs
    # 'unsafe-inline' because the React app sets inline `style` attributes
    # directly - verify this against Razorpay's current published CSP
    # guidance before launch, as their domains can change.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; img-src 'self' data: https://*.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;
    client_max_body_size 4m;

    # --- API -------------------------------------------------------------
    location /api/ {
        limit_req zone=api_edge burst=60 nodelay;
        proxy_pass http://snowpine_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Razorpay's webhook must reach this exact path over HTTPS - same
    # upstream as /api/, called out separately only so it's easy to find
    # when configuring the webhook URL in the Razorpay dashboard.
    location = /api/webhooks/razorpay {
        proxy_pass http://snowpine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Static SPA --------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router (BrowserRouter): a direct load/refresh of e.g.
        # /product/3 or /admin has no matching file on disk, so fall back
        # to index.html and let the client-side router take over - without
        # this, every route but "/" 404s on refresh or direct link.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because this location's own add_header above discards
        # every header inherited from the server block - see the note there.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; img-src 'self' data: https://*.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
