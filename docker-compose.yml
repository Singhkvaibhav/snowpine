# Production stack.
#
#                internet
#                   |
#              [  proxy  ]   nginx: TLS, static SPA, API routing
#                   |
#                   v
#                  api
#                   |
#               postgres
#
# Only the proxy publishes ports. Postgres is not reachable from the host
# at all - an exposed database port is one of the most common ways a
# small deployment gets compromised.
#
# No queue/worker/backup services yet, unlike a larger stack - Snowpine
# has no background jobs or file uploads at this stage. Add them when the
# store actually needs them, not speculatively.
#
# NOTE: this file has not been run against a real Docker daemon in this
# environment. The pieces it depends on (nginx config, health endpoint,
# migrations) have been individually exercised; the orchestration itself
# has not. Treat the first `docker compose up` as a real test.

name: snowpine

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/snowpine.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://snowpine:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/snowpine
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports` - only the proxy reaches the API.
    expose:
      - "4000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snowpine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: snowpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowpine -d snowpine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  certbot-certs:
  certbot-webroot:
